# House template, measured on the approved 70 QT Yukon export (2000x2000), cross-checked
# against the Trailmate 25. Replace with numbers read from the template PSD once available.
name: igloo_default
fonts_dir: fonts
# House face is Gibson (SemiBold + Regular). The Photoshop script sets real Gibson;
# previews use Montserrat sized by cap height, flagged in report.json.
font_search_dirs: []
font_fallbacks: { Gibson: Montserrat }
canvas: { w: 2000, h: 2000, bg: "#E3E5E2" }

tokens:
  # cap_ratio = cap height / canvas width
  fonts:
    title:             { family: Gibson, weight: 600, cap_ratio: 0.0320 }
    label:             { family: Gibson, weight: 600, cap_ratio: 0.0195 }
    callout_num:       { family: Gibson, weight: 600, cap_ratio: 0.0330 }  # max; shrinks to fit the can
    callout_word:      { family: Gibson, weight: 600, cap_ratio: 0.0175 }  # "CANS"
    callout_text:      { family: Gibson, weight: 400, cap_ratio: 0.0160 }  # "INTERIOR DIMENSIONS (L x W x H):"
    callout_text_bold: { family: Gibson, weight: 600, cap_ratio: 0.0145 }  # "HOLDS UP TO"
    callout_value:     { family: Gibson, weight: 600, cap_ratio: 0.0175 }  # interior values
  colors: { line: "#000000", text: "#000000", callout_text: "#000000",
            can_fill: "#BBBCBE", can_neck: "#A5A6A7", can_tab: "#BDBFC2" }
  stroke_ratio: 0.0020            # 4px at 2000
  label_gap_capheights: 0.8       # line stops 0.8 cap from the label
  number_format: "{value:g}”"

layout:
  title_band: { top: 0.017, height: 0.064 }     # title cap centered at y=0.049
  safe_area: { left: 0.06, right: 0.06, top: 0.15, bottom: 0.158 }
  placement: { product_center_x: 0.495, group_bottom: 0.842 }
  reserved_zones:
    cans:     { x: 0.015, y: 0.83, w: 0.145, h: 0.17 }
    interior: { x: 0.30,  y: 0.90, w: 0.40,  h: 0.06 }
  callouts:
    cans: cans
    interior: interior
  cans:     { center_x: 0.0868, head_cy: 0.844, can_top: 0.866, can_w: 0.0785, num_cy: 0.940, word_cy: 0.978 }
  interior: { cx: 0.5, l1_cy: 0.916, l2_cy: 0.946 }
  optical_center_target: [0.50, 0.55]
  legibility_min_cap_px: 36

annotations:
  clearance_ratio: 0.012
  ticks: none
  extension_lines: "off"
  height_mode: screen_vertical
  corner_gap_ratio: 0.055

fit:
  white_threshold: 245
  max_uncovered: 0.01

search:
  samples: 300
  refine_top: 10
  top_n: 3
  ranges:
    offset_ratio: [0.035, 0.10]      # on-screen offset / projected box diagonal
    label_t: [0.35, 0.65]
    height_side: [left, right]
    group_scale: [0.94, 1.0]         # 1.0 = group touches the safe area on its limiting side
    group_nudge: [-0.01, 0.01]
    extension_lines: [false]

targets:
  offset_ratio: 0.06
  fill: 0.85

weights:
  offset_equality: 3.0
  offset_target: 1.0
  label_centering: 0.5
  whitespace_balance: 0.0         # placement is a template rule now
  optical_center: 0.0
  fill: 1.0
  height_side_clutter: 1.5
  extension_lines: 0.3
  style_deviation: 0.0
